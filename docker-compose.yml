services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slideaway
      POSTGRES_PASSWORD: slideaway
      POSTGRES_DB: slideaway
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: slideaway
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    build: ./apps/api
    env_file:
      - ./apps/api/.env
    depends_on:
      - postgres
      - minio
    ports:
      - "8000:8000"

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
